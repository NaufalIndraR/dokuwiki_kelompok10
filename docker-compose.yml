version: '3.8'

# ==============================================================================
# Docker Compose untuk DokuWiki (Alternatif Pengujian Cepat Lokal)
# Proyek Praktikum Komunikasi Data - CS IPB
# ==============================================================================

services:
  kelompok10-dokuwiki:
    image: lscr.io/linuxserver/dokuwiki:latest
    container_name: kelompok10-dokuwiki
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Asia/Jakarta
    volumes:
      - dokuwiki_config:/config
    ports:
      - "8080:80"
    restart: unless-stopped

volumes:
  dokuwiki_config:
